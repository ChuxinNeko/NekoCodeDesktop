<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; child-src 'self' blob:"
    />
    <title>Wallpaper</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #wp {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #wp > iframe.we-fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
      }
    </style>
    <script src="./engine/webwallgl.global.min.js"></script>
    <script type="module" src="./renderer.js"></script>
  </head>
  <body>
    <div id="wp"></div>
  </body>
</html>
