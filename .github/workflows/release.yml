name: Build and release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current version to GitHub Releases (off = build artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases so an older build cannot become Latest after a newer version.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Detect a version increase
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: bun scripts/release-plan.ts
      - name: Check release gating and asset completeness
        run: bun test scripts/release-plan.test.ts scripts/release-workflow.test.ts scripts/build-ios.test.ts

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build PI runtime and model data
        run: bun run pi:build
      - name: Type check
        run: bun run typecheck
      - name: Build application
        run: bun run build
      - name: Build installers
        run: bun run package --${{ matrix.platform }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb

  build-android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        if: needs.plan.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing repository secret: $key. See README Android release setup."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nekocode-release.keystore"
          test -s "$RUNNER_TEMP/nekocode-release.keystore"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build signed release APK
        if: needs.plan.outputs.publish == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nekocode-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          # Reserve codes 1 and 2 for the initial local builds. Retries keep the same code.
          export ANDROID_VERSION_CODE="$((GITHUB_RUN_NUMBER + 2))"
          bun scripts/build-android.ts --release
      - name: Verify release APK signature
        if: needs.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/mobile/NekoCode-${RELEASE_VERSION}-android.apk"'
      - name: Build debug APK for artifact-only runs
        if: needs.plan.outputs.publish != 'true'
        run: bun run mobile:apk
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/nekocode-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          if-no-files-found: error
          retention-days: 14
          path: dist/mobile/*.apk

  build-ios:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check iOS packaging configuration
        run: bun test scripts/build-ios.test.ts
      - name: Build unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ios
          bun run mobile:ipa 2>&1 | tee out/ios/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: installers-ios
          if-no-files-found: error
          retention-days: 14
          path: dist/mobile/*-ios-unsigned.ipa
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          if-no-files-found: ignore
          retention-days: 7
          path: out/ios/build.log

  release:
    needs: [plan, build, build-android, build-ios]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Publish complete release with notes and checksums
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const { createHash } = require('node:crypto');
            const { owner, repo } = context.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const prerelease = process.env.RELEASE_PRERELEASE === 'true';
            // electron-builder uses format-specific architecture names for Linux artifacts.
            const suffixes = ['win-x64.exe', 'mac-x64.dmg', 'mac-x64.zip', 'mac-arm64.dmg', 'mac-arm64.zip', 'linux-x86_64.AppImage', 'linux-amd64.deb'];
            const names = suffixes.map(suffix => `NekoCode-Desktop-${version}-${suffix}`);
            names.push(`NekoCode-${version}-android.apk`);
            names.push(`NekoCode-${version}-ios-unsigned.ipa`);
            // Verify every platform before creating a tag or release.
            const available = await fs.readdir('installers');
            const missing = names.filter(name => !available.includes(name));
            if (missing.length > 0) {
              throw new Error(`Missing release installers: ${missing.join(', ')}. Downloaded files: ${available.sort().join(', ')}`);
            }
            const sums = [];
            for (const name of names) {
              const data = await fs.readFile(path.join('installers', name));
              sums.push(`${createHash('sha256').update(data).digest('hex')}  ${name}`);
            }
            await fs.writeFile('installers/SHA256SUMS.txt', sums.join('\n') + '\n');
            names.push('SHA256SUMS.txt');

            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && !existing.draft) {
              throw new Error(`Release ${tag} is already published; increase package.json version instead of overwriting it.`);
            }
            // A retry may reuse a draft, but it must never move an existing tag.
            try {
              let object = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data.object;
              while (object.type === 'tag') object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object;
              if (object.sha !== context.sha) throw new Error(`Tag ${tag} points to another commit`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const notes = await github.rest.repos.generateReleaseNotes({ owner, repo, tag_name: tag, target_commitish: context.sha });
            const body = `${notes.data.body}\n\n## Downloads\nWindows: EXE installer · macOS: Intel / Apple Silicon DMG or ZIP · Linux: AppImage or DEB · Android 8.0+: signed APK · iOS 15.0+: unsigned IPA for self-signing.\n\nSHA-256 checksums are provided in SHA256SUMS.txt.\n\nDesktop builds are not signed with a Windows publisher certificate or notarized by Apple. iOS IPA files must be signed by the user with Sideloadly or AltStore before installation; they cannot be installed directly. No Apple signing certificates are included. Android APKs use the project's release signing key. If you previously installed a debug APK, uninstall it before installing the release APK (local pairing settings will be removed).`;
            const release = existing ?? (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: context.sha, name: `NekoCode Desktop ${tag}`, body, draft: true, prerelease })).data;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            for (const name of names) {
              const old = assets.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              const data = await fs.readFile(path.join('installers', name));
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } });
            }
            // Latest changes only after all nine installers and the checksum file are uploaded.
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, name: `NekoCode Desktop ${tag}`, body, draft: false, prerelease, make_latest: prerelease ? 'false' : 'true' });
            core.info(`Published ${tag}: ${release.html_url}`);
