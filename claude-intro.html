<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, I'm Claude</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: pointer; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 30 秒自我介绍动画（发布会风格）
// 点击：暂停 / 继续（结束后点击重播）；空格同上；← → 快退 / 快进 2 秒；R 重播
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const DURATION = 30;
const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif';
const MONO = '"SF Mono", Menlo, Consolas, "Microsoft YaHei", monospace';
const CORAL = '#D97757';

let W, H, S, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(W / 1280, H / 720);
}
addEventListener('resize', resize);
resize();

// ---------- 工具函数 ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
// 场景可见度：a 淡入、b 淡出
function env(t, a, b, fi = .8, fo = .6) {
  if (t < a || t > b) return 0;
  return Math.min(easeOut(prog(t, a, a + fi)), 1 - easeInOut(prog(t, b - fo, b)));
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, o = {}) {
  const { size = 48, weight = 600, alpha = 1, blur = 0, color = '#fff', grad = null,
          spacing = 0, dy = 0, scale = 1, font = FONT } = o;
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size * S}px ${font}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (spacing * S) + 'px';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (blur > 0.1) ctx.filter = `blur(${blur * S}px)`;
  ctx.translate(x, y + dy * S);
  ctx.scale(scale, scale);
  if (grad) {
    const w = ctx.measureText(str).width;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    grad.forEach((c, i) => g.addColorStop(i / (grad.length - 1), c));
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = color;
  }
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

// ---------- 背景 ----------
const stars = Array.from({ length: 170 }, () => ({
  x: Math.random(), y: Math.random(), z: Math.random(), p: Math.random() * 6.28
}));

function background(t) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  const glow = prog(t, 0.5, 3);
  const gx = W / 2 + Math.sin(t * .3) * W * .15;
  const gy = H / 2 + Math.cos(t * .23) * H * .1;
  const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * .7);
  g.addColorStop(0, `rgba(217,119,87,${.11 * glow})`);
  g.addColorStop(.5, `rgba(120,80,210,${.05 * glow})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const starA = prog(t, 0.5, 2.5);
  for (const s of stars) {
    const y = (((s.y - t * 0.004 * (0.5 + s.z)) % 1) + 1) % 1;
    const tw = 0.5 + 0.5 * Math.sin(t * 1.5 + s.p);
    const sz = (0.5 + s.z * 1.2) * S;
    ctx.fillStyle = `rgba(255,255,255,${(0.08 + 0.25 * s.z) * tw * starA})`;
    ctx.fillRect(s.x * W, y * H, sz, sz);
  }
}

function vignette() {
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ---------- 星芒标志 ----------
function spark(x, y, r, rot, alpha, grow = 1) {
  if (alpha <= 0.001 || r <= 0) return;
  const RAYS = 12;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  const gr = r * 2.4 * easeOut(clamp(grow));
  if (gr > 0) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
    g.addColorStop(0, 'rgba(217,119,87,.38)');
    g.addColorStop(1, 'rgba(217,119,87,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, gr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.rotate(rot);
  ctx.fillStyle = CORAL;
  for (let i = 0; i < RAYS; i++) {
    const rp = easeBack(clamp(grow * 1.5 - i / RAYS * 0.5));
    if (rp <= 0) continue;
    const len = r * (i % 2 ? .76 : 1) * (0.9 + 0.1 * Math.sin(i * 2.3)) * rp;
    ctx.save();
    ctx.rotate(i / RAYS * Math.PI * 2);
    ctx.beginPath();
    ctx.moveTo(-r * .075, 0);
    ctx.quadraticCurveTo(-r * .05, -len * .6, 0, -len);
    ctx.quadraticCurveTo(r * .05, -len * .6, r * .075, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * .13 * clamp(grow * 2), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 粒子球 ----------
const N = 700;
const pts = Array.from({ length: N }, (_, i) => {
  const y = 1 - (i / (N - 1)) * 2, rr = Math.sqrt(1 - y * y), th = i * 2.39996;
  return {
    sx: Math.cos(th) * rr, sy: y, sz: Math.sin(th) * rr,
    rx: (Math.random() - .5) * 6, ry: (Math.random() - .5) * 4, rz: (Math.random() - .5) * 4,
    d: Math.random()
  };
});

function sphere(t, cx, cy, R, form, alpha, spin) {
  if (alpha <= 0.001) return;
  const ca = Math.cos(spin), sa = Math.sin(spin), cb = Math.cos(.35), sb = Math.sin(.35);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pts) {
    const f = easeInOut(clamp(form * 1.3 - p.d * .3));
    const b = 1 + 0.03 * Math.sin(t * 2 + p.d * 6) * f;
    const x = lerp(p.rx, p.sx, f) * b, y = lerp(p.ry, p.sy, f) * b, z = lerp(p.rz, p.sz, f) * b;
    const x1 = x * ca - z * sa, z1 = x * sa + z * ca;
    const y1 = y * cb - z1 * sb, z2 = y * sb + z1 * cb;
    const persp = 3 / Math.max(0.5, 3 + z2);
    const depth = clamp((1 - z2) / 2);
    const px = cx + x1 * R * persp, py = cy + y1 * R * persp;
    const size = (0.7 + 1.7 * depth) * S * persp;
    ctx.fillStyle = `hsla(${lerp(20, -90, (p.sy + 1) / 2)},85%,${58 + depth * 17}%,${alpha * (0.15 + 0.85 * depth)})`;
    ctx.fillRect(px - size / 2, py - size / 2, size, size);
  }
  ctx.restore();
}

// ---------- 场景 1：Hello（0–4s）----------
function sceneHello(t) {
  if (t > 4.1) return;
  const out = easeInOut(prog(t, 3.3, 4));
  const grow = prog(t, 0.3, 1.8);
  const rise = easeInOut(prog(t, 1.6, 2.4));
  spark(W / 2, H / 2 - 60 * S * rise, 64 * S * (1 - out * 0.9), t * 0.5, 1 - out, grow);
  const p = easeOut(prog(t, 1.9, 2.9));
  text('Hello.', W / 2, H / 2 + 92 * S, {
    size: 84, weight: 700, alpha: p * (1 - out), blur: (1 - p) * 14 + out * 10,
    grad: ['#FFD1B8', CORAL, '#C7A2FF'], dy: (1 - p) * 20, spacing: -1
  });
}

// ---------- 场景 2：我是 Claude（4–9s）----------
function sceneIntro(t) {
  const a = env(t, 3.9, 9.2, .3, .7);
  if (!a) return;
  const form = prog(t, 4, 6.2);
  const tp = easeOut(prog(t, 5.4, 6.4));
  sphere(t, W / 2, H / 2, 240 * S * (1 + 0.15 * prog(t, 8.5, 9.2)), form, a * (1 - 0.45 * tp), t * 0.45);
  text('我是 Claude', W / 2, H / 2 - 10 * S, {
    size: 96, weight: 700, alpha: a * tp, blur: (1 - tp) * 16, scale: lerp(1.08, 1, tp), spacing: 1
  });
  const sp = easeOut(prog(t, 6.3, 7.2));
  text('由 Anthropic 打造的 AI 助手', W / 2, H / 2 + 80 * S, {
    size: 28, weight: 500, alpha: a * sp, color: 'rgba(235,235,245,.72)', dy: (1 - sp) * 14, spacing: 2
  });
}

// ---------- 场景 3：能力卡片（9–15s）----------
const SKILLS = [
  ['</>', '读懂代码库', '跨文件理解上下文'],
  ['{ }', '编写与重构', '贴合项目原有风格'],
  ['>_', '执行命令', '构建、测试与 Git'],
  ['✓', '调试与审查', '定位问题，给出修复'],
];

function sceneSkills(t) {
  const a = env(t, 9, 15.2, .6, .6);
  if (!a) return;
  const tp = easeOut(prog(t, 9, 9.8));
  text('我能为你做什么', W / 2, H * 0.2, { size: 52, weight: 700, alpha: a * tp, blur: (1 - tp) * 10, dy: (1 - tp) * 16 });

  const cw = 232 * S, ch = 270 * S, gap = 24 * S;
  const x0 = W / 2 - (cw * 4 + gap * 3) / 2, cy = H * 0.57;
  SKILLS.forEach(([glyph, label, desc], i) => {
    const p = prog(t, 9.7 + i * 0.28, 10.6 + i * 0.28);
    if (p <= 0) return;
    const e = easeOut(p);
    const hl = Math.max(0, 1 - Math.abs(t - (12.2 + i * 0.45)) / 0.45);
    const x = x0 + i * (cw + gap), y = cy - ch / 2 + (1 - e) * 50 * S - hl * 6 * S;
    ctx.save();
    ctx.globalAlpha = a * e;
    ctx.translate(x + cw / 2, y + ch / 2);
    const sc = lerp(0.92, 1, easeBack(p)) * (1 + hl * 0.03);
    ctx.scale(sc, sc);
    ctx.translate(-cw / 2, -ch / 2);

    rr(0, 0, cw, ch, 22 * S);
    ctx.fillStyle = `rgba(255,255,255,${0.055 + hl * 0.04})`;
    ctx.fill();
    const bg = ctx.createLinearGradient(0, 0, cw, ch);
    bg.addColorStop(0, `rgba(255,180,150,${0.35 + hl * 0.5})`);
    bg.addColorStop(1, `rgba(170,140,255,${0.15 + hl * 0.5})`);
    ctx.strokeStyle = bg;
    ctx.lineWidth = 1.2 * S;
    ctx.stroke();

    const is = 68 * S, ix = cw / 2 - is / 2, iy = 46 * S;
    rr(ix, iy, is, is, 18 * S);
    const ig = ctx.createLinearGradient(ix, iy, ix + is, iy + is);
    ig.addColorStop(0, '#F0A07E');
    ig.addColorStop(1, '#8E6BF0');
    ctx.fillStyle = ig;
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${24 * S}px ${MONO}`;
    ctx.fillText(glyph, cw / 2, iy + is / 2 + 1 * S);
    ctx.font = `700 ${26 * S}px ${FONT}`;
    ctx.fillText(label, cw / 2, 166 * S);
    ctx.fillStyle = 'rgba(235,235,245,.6)';
    ctx.font = `500 ${16 * S}px ${FONT}`;
    ctx.fillText(desc, cw / 2, 206 * S);
    ctx.restore();
  });
}

// ---------- 场景 4：上下文数字（15–20s）----------
function sceneContext(t) {
  const a = env(t, 15, 20.2, .6, .6);
  if (!a) return;
  const y = H * 0.45;
  const lp = easeOut(prog(t, 15.1, 15.9));
  text('超长上下文', W / 2, y - 130 * S, { size: 22, weight: 600, alpha: a * lp, color: CORAL, spacing: 6, dy: (1 - lp) * 10 });

  const cp = easeExpo(prog(t, 15.6, 18.2));
  const val = Math.round(1000000 * cp).toLocaleString('en-US');
  ctx.save();
  ctx.globalAlpha = a * easeOut(prog(t, 15.5, 16.1));
  ctx.font = `700 ${150 * S}px ${FONT}`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (-3 * S) + 'px';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const fw = ctx.measureText('1,000,000').width;
  const xr = W / 2 + fw / 2;
  const g = ctx.createLinearGradient(xr - fw, 0, xr, 0);
  g.addColorStop(0, '#FFD0B5');
  g.addColorStop(.5, CORAL);
  g.addColorStop(1, '#A98BFF');
  ctx.fillStyle = g;
  ctx.shadowColor = 'rgba(217,119,87,.45)';
  ctx.shadowBlur = 40 * S;
  ctx.fillText(val, xr, y);
  ctx.restore();

  const lw = easeInOut(prog(t, 16, 18.2)) * 560 * S;
  if (lw > 0) {
    const lg = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
    lg.addColorStop(0, 'rgba(217,119,87,0)');
    lg.addColorStop(.5, `rgba(255,200,170,${a})`);
    lg.addColorStop(1, 'rgba(169,139,255,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(W / 2 - lw / 2, y + 95 * S, lw, 2 * S);
  }
  const sp = easeOut(prog(t, 16.6, 17.4));
  text('tokens 上下文窗口', W / 2, y + 140 * S, { size: 30, weight: 600, alpha: a * sp, dy: (1 - sp) * 12, spacing: 1 });
  const sp2 = easeOut(prog(t, 17.8, 18.6));
  text('整个项目，一次读完。', W / 2, y + 188 * S, { size: 22, weight: 500, alpha: a * sp2, color: 'rgba(235,235,245,.6)', dy: (1 - sp2) * 10, spacing: 2 });
}

// ---------- 场景 5：终端演示（20–25.7s）----------
const STEPS = [
  [22.7, '●', '读取 src/auth/session.ts', 'rgba(235,235,245,.78)', CORAL],
  [23.2, '●', '定位问题：token 刷新时机错误', 'rgba(235,235,245,.78)', CORAL],
  [23.7, '●', '修改 2 个文件，新增 1 个测试', 'rgba(235,235,245,.78)', CORAL],
  [24.3, '✓', '全部测试通过', '#5BE37D', '#5BE37D'],
];

function sceneTerminal(t) {
  const a = env(t, 20, 25.7, .6, .6);
  if (!a) return;
  const tp = easeOut(prog(t, 20, 20.8));
  text('在终端里，与你并肩工作', W / 2, H * 0.17, { size: 48, weight: 700, alpha: a * tp, blur: (1 - tp) * 10, dy: (1 - tp) * 16 });

  const wp = easeOut(prog(t, 20.3, 21.2));
  if (wp <= 0) return;
  const ww = 780 * S, wh = 340 * S;
  ctx.save();
  ctx.globalAlpha = a * wp;
  ctx.translate(W / 2, H * 0.58 + (1 - wp) * 40 * S);
  const sc = lerp(.94, 1, wp);
  ctx.scale(sc, sc);
  ctx.translate(-ww / 2, -wh / 2);

  ctx.shadowColor = 'rgba(217,119,87,.28)';
  ctx.shadowBlur = 60 * S;
  rr(0, 0, ww, wh, 16 * S);
  ctx.fillStyle = '#121214';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.12)';
  ctx.lineWidth = 1 * S;
  ctx.stroke();

  ctx.save();
  rr(0, 0, ww, wh, 16 * S);
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.04)';
  ctx.fillRect(0, 0, ww, 42 * S);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(0, 42 * S, ww, 1 * S);
  ctx.restore();

  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => {
    ctx.beginPath();
    ctx.arc(22 * S + i * 20 * S, 21 * S, 6 * S, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(235,235,245,.45)';
  ctx.font = `500 ${14 * S}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('claude — ~/my-app', ww / 2, 21 * S);

  ctx.textAlign = 'left';
  ctx.font = `500 ${19 * S}px ${MONO}`;
  const lx = 32 * S, ly = 84 * S, lh = 44 * S;
  const cmd = '帮我修复登录后会话过期的 bug';
  const typing = prog(t, 21.2, 22.4);
  const typed = cmd.slice(0, Math.floor(cmd.length * typing));
  ctx.fillStyle = CORAL;
  ctx.fillText('>', lx, ly);
  ctx.fillStyle = '#fff';
  ctx.fillText(typed, lx + 24 * S, ly);
  const isTyping = typing > 0 && typing < 1;
  if (t < 22.6 && (isTyping || Math.floor(t * 2.5) % 2 === 0)) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillRect(lx + 24 * S + ctx.measureText(typed).width + 2 * S, ly - 11 * S, 10 * S, 22 * S);
  }

  STEPS.forEach(([st, icon, s, color, iconColor], i) => {
    const p = easeOut(prog(t, st, st + .4));
    if (p <= 0) return;
    ctx.globalAlpha = a * wp * p;
    const y = ly + lh * (i + 1.3), x = lx + (1 - p) * 12 * S;
    ctx.fillStyle = iconColor;
    ctx.fillText(icon, x, y);
    ctx.fillStyle = color;
    ctx.fillText(s, x + 26 * S, y);
  });
  ctx.restore();
}

// ---------- 场景 6：收尾（25.5–30s）----------
function sceneFinale(t, rt) {
  if (t < 25.4) return;
  sphere(t, W / 2, H * 0.42, 300 * S, prog(t, 25.5, 27.5), 0.35 * easeOut(prog(t, 25.5, 26.5)), t * 0.3);
  spark(W / 2, H * 0.36, 62 * S, t * 0.4, easeOut(prog(t, 25.7, 26.2)), prog(t, 25.7, 27));
  const p = easeOut(prog(t, 26.4, 27.4));
  text('Claude', W / 2, H * 0.58, { size: 104, weight: 700, alpha: p, blur: (1 - p) * 16, spacing: -1, scale: lerp(1.06, 1, p) });
  const p2 = easeOut(prog(t, 27.2, 28));
  text('想得更深，做得更多。', W / 2, H * 0.58 + 82 * S, { size: 30, weight: 500, alpha: p2, color: 'rgba(235,235,245,.72)', dy: (1 - p2) * 12, spacing: 2 });
  const p3 = easeOut(prog(t, 28, 28.8));
  text('ANTHROPIC', W / 2, H * 0.58 + 146 * S, { size: 15, weight: 600, alpha: p3 * 0.55, spacing: 8 });
  if (t >= DURATION) {
    text('点击任意处重播', W / 2, H - 40 * S, { size: 14, weight: 500, alpha: 0.25 + 0.2 * Math.sin(rt * 3), spacing: 2 });
  }
}

function progressBar(t) {
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(0, H - 2, W, 2);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.fillRect(0, H - 2, W * t / DURATION, 2);
}

// ---------- 时间轴与交互 ----------
let start = performance.now(), paused = false, pauseAt = 0;
const now = () => paused ? pauseAt : (performance.now() - start) / 1000;

function seek(delta) {
  const target = clamp(Math.min(now(), DURATION) + delta, 0, DURATION);
  if (paused) pauseAt = target;
  else start = performance.now() - target * 1000;
}
function restart() { start = performance.now(); paused = false; }
function toggle() {
  if (now() >= DURATION) return restart();
  if (paused) { start = performance.now() - pauseAt * 1000; paused = false; }
  else { pauseAt = now(); paused = true; }
}
cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight') seek(2);
  else if (e.code === 'ArrowLeft') seek(-2);
  else if (e.code === 'KeyR') restart();
});

function frame() {
  const rt = performance.now() / 1000;
  const t = Math.min(now(), DURATION);
  background(t);
  sceneHello(t);
  sceneIntro(t);
  sceneSkills(t);
  sceneContext(t);
  sceneTerminal(t);
  sceneFinale(t, rt);
  vignette();
  progressBar(t);
  if (paused) text('❚❚  已暂停', W / 2, H - 40 * S, { size: 14, weight: 500, alpha: 0.45, spacing: 2 });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
