name: nekocode_mobile
description: NekoCode 原生 Flutter 移动客户端。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.4'

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_miuix: ^1.3.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/home-sakura.webp
    - assets/workflow/
