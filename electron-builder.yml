appId: com.chuxinneko.nekocode-desktop
productName: NekoCode Desktop
directories:
  output: dist
  buildResources: resources/icons
artifactName: NekoCode-Desktop-${version}-${os}-${arch}.${ext}
asar: true
# Chromium's UI strings (context menus, dialogs) for the languages the app
# itself offers; the other ~50 locale packs were ~48 MB nobody reads.
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US
# node-pty 1.1 uses stable Node-API: official Windows/macOS prebuilds and the
# Linux binary built by bun install work in Electron without another ABI rebuild.
# Each architecture is built on a matching native runner.
npmRebuild: false
# Keep in sync with the includes repeated under win/mac/linux `files` below.
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  - licenses/**/*
  # Workspace packages are followed through node_modules by electron-builder.
  # Keep their compiled distributions; source-only workspaces are not runnable.
  - '!node_modules/**/{test,tests,__tests__,benchmark,benchmarks}/**/*'
  - '!node_modules/**/*.map'
  # The ACP adapters' own dependencies ship the agents: the Codex CLI (~440 MB)
  # and Claude Code (~230 MB, not redistributable). The adapters drive the
  # user's installed CLI instead, so none of that goes into the package.
  - '!node_modules/@openai/codex/**/*'
  - '!node_modules/@openai/codex-*/**/*'
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**/*'
  # ast-grep grammars ship their tree-sitter C sources for building from
  # scratch; the prebuilt parsers are what runs. Each platform below also drops
  # the other platforms' prebuilds.
  - '!node_modules/@ast-grep/lang-*/src/**/*'
  # Nothing loads type declarations at runtime (no TypeScript compiler ships),
  # and the pi workspace packages are linked whole, TypeScript sources and doc
  # screenshots included, next to the dist/ that actually runs. Their docs/ and
  # examples/ stay: the agent reads them when asked about pi itself.
  - '!node_modules/**/*.d.{ts,mts,cts}'
  - '!node_modules/@earendil-works/*/src/**/*'
  - '!node_modules/@earendil-works/*/docs/images/**/*'
asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/@esbuild/**/*
  - node_modules/@silvia-odwyer/photon-node/**/*
  # The Computer Use driver loads its DLL by path, which cannot resolve inside
  # app.asar; the worker imports this unpacked copy (src/main/computer/worker.ts).
  - node_modules/@trycua/**/*
  - node_modules/@ubjs/**/*
  # koffi's native binary, used by the worker to raise the window being operated.
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
  # The ACP adapters run as a separate process on Electron-as-Node, loaded from
  # disk rather than from inside app.asar (src/main/acp/launch.ts). This is each
  # adapter plus everything the Claude adapter imports at runtime.
  - node_modules/@agentclientprotocol/**/*
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*
  - node_modules/zod/**/*
  # ast-grep's native module and its grammars: the grammars are opened by path
  # from native code, which cannot read inside app.asar (src/main/ast-tools.ts).
  - node_modules/@ast-grep/**/*
extraResources:
  - from: resources/plugin-examples
    to: plugin-examples
  - from: packages/plugin-api
    to: plugin-api
  - from: docs/plugins.md
    to: plugin-api/guide.md
  - from: resources/skills
    to: skills
  - from: resources/templates
    to: templates
    filter:
      - '**/*'
      - '!**/node_modules/**/*'
      - '!**/.git/**/*'
      - '!**/.next/**/*'
  - from: licenses
    to: licenses
win:
  icon: resources/icons/icon.ico
  target: nsis
  files:
    # A platform `files` list REPLACES the top-level one for the app's own
    # files (only its `!` exclusions are merged into node_modules), so the
    # includes must be repeated here. A list of exclusions alone means
    # "everything in the repo" — dist/, demo/, mobile/ and src/ included.
    - out/main/**/*
    - out/preload/**/*
    - out/renderer/**/*
    - package.json
    - licenses/**/*
    - '!node_modules/@ast-grep/lang-*/prebuilds/prebuild-{Linux,macOS}-*/**/*'
nsis:
  include: resources/installer.nsh
  installerLanguages:
    - en_US
    - zh_CN
    - zh_TW
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NekoCode Desktop
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Ad-hoc signing works without distributing a developer certificate to CI.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  files:
    # Includes repeated for the reason given under `win.files`.
    - out/main/**/*
    - out/preload/**/*
    - out/renderer/**/*
    - package.json
    - licenses/**/*
    - '!node_modules/@ast-grep/lang-*/prebuilds/prebuild-{Linux,Windows}-*/**/*'
linux:
  icon: resources/icons/icon.png
  category: Development
  maintainer: ChuxinNeko
  files:
    # Includes repeated for the reason given under `win.files`.
    - out/main/**/*
    - out/preload/**/*
    - out/renderer/**/*
    - package.json
    - licenses/**/*
    - '!node_modules/@ast-grep/lang-*/prebuilds/prebuild-{macOS,Windows}-*/**/*'
  target:
    - AppImage
    - deb
# Writes app-update.yml (the updater's cache directory name) and latest*.yml;
# CI uploads them with the installers and the NSIS blockmap, which
# electron-updater uses to download only the changed blocks
# (src/main/app-updates.ts). Nothing is published from here: --publish never.
publish:
  provider: github
  owner: ChuxinNeko
  repo: NekoCodeDesktop
