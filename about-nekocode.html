<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logicc AI · Keynote Intro</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR, S;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = Math.min(Math.max(Math.min(W / 1100, H / 700), 0.35), 1.6);
}
addEventListener('resize', resize); resize();

const FONT = '-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif';
const DURATION = 30;

/* ---------- 工具函数 ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, e) => clamp((t - s) / (e - s));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// 淡入淡出包络
function env(t, s, e, fi = .7, fo = .6){
  if (t < s || t > e) return 0;
  return Math.min(easeOut(seg(t, s, s + fi)), 1 - easeInOut(seg(t, e - fo, e)));
}
// 关键帧插值
function kf(t, frames){
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 0; i < frames.length - 1; i++){
    const [t0, v0] = frames[i], [t1, v1] = frames[i + 1];
    if (t <= t1) return lerp(v0, v1, easeInOut(seg(t, t0, t1)));
  }
  return frames[frames.length - 1][1];
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 文字绘制（发布会式：上浮 + 淡入 + 轻缩放） ---------- */
function text(str, x, y, size, o = {}){
  const { weight = 600, alpha = 1, color = '#f5f5f7', grad = null, rise = 0, scale = 1 } = o;
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y + rise);
  ctx.scale(scale, scale);
  ctx.font = `${weight} ${size * S}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (grad){
    const w = ctx.measureText(str).width;
    const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    grad.forEach((c, i) => g.addColorStop(i / (grad.length - 1), c));
    ctx.fillStyle = g;
  } else ctx.fillStyle = color;
  ctx.fillText(str, 0, 0);
  ctx.restore();
}
const riseOf = (t, s) => (1 - easeOut(seg(t, s, s + .9))) * 36 * S;

/* ---------- 粒子球 ---------- */
const N = 900, P = [];
for (let i = 0; i < N; i++){
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996;
  P.push({
    sx: Math.cos(th) * r, sy: y, sz: Math.sin(th) * r,
    rx: (Math.random() - .5) * 2.4, ry: (Math.random() - .5) * 2.4,
    ang: Math.random() * Math.PI * 2, ringR: 1 + (Math.random() - .5) * .14,
    ringY: (Math.random() - .5) * .05,
    size: Math.random() * 1.4 + .5, hue: i / N
  });
}

function drawParticles(t){
  const cx = W / 2, cy = H / 2;
  const R0 = Math.min(W, H) * .2;
  const gather = easeInOut(seg(t, 0, 3.2));
  const R = R0 * kf(t, [[0,1],[3.6,1],[5,1.35],[11.8,1.35],[12.8,1.9],[20,1.9],[21,1.3],[25,1.3],[27,1.15]]) * (1 + .03 * Math.sin(t * 2));
  const ga = kf(t, [[0,1],[4,1],[5,.4],[12,.4],[12.8,.22],[20,.22],[20.8,.45],[25,.45],[26.5,.9],[30,.9]]) * easeOut(seg(t, 0, 1.2));
  const ringMix = easeInOut(seg(t, 24.8, 27));
  const rotY = t * .45, tilt = .35 + ringMix * .85;
  const cY = Math.cos(rotY), sY = Math.sin(rotY), cT = Math.cos(tilt), sT = Math.sin(tilt);

  // 中心光晕
  const glowA = kf(t, [[0,0],[2.5,.0],[3.4,1],[4.5,.6],[12,.6],[12.8,.3],[20,.3],[21,.5],[30,.6]]);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.6);
  g.addColorStop(0, `hsla(235,100%,62%,${.28 * glowA})`);
  g.addColorStop(.5, `hsla(280,100%,55%,${.10 * glowA})`);
  g.addColorStop(1, 'hsla(280,100%,50%,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of P){
    const k = 1.9;
    let x = lerp(p.sx, Math.cos(p.ang + t * .15) * p.ringR * k, ringMix);
    let y = lerp(p.sy, p.ringY, ringMix);
    let z = lerp(p.sz, Math.sin(p.ang + t * .15) * p.ringR * k, ringMix);
    const x1 = x * cY - z * sY, z1 = x * sY + z * cY;
    const y1 = y * cT - z1 * sT, z2 = y * sT + z1 * cT;
    const persp = 1 / (1 + z2 * .3);
    const depth = clamp(.3 + .7 * (1 - z2 / k) / 2, .15, 1);
    const px = lerp(cx + p.rx * W * .6, cx + x1 * R * persp, gather);
    const py = lerp(cy + p.ry * H * .6, cy + y1 * R * persp, gather);
    const h = 210 + p.hue * 110 + Math.sin(t * .5) * 20;
    ctx.fillStyle = `hsla(${h},95%,${60 + depth * 15}%,${ga * depth})`;
    ctx.beginPath();
    ctx.arc(px, py, Math.max(.5, p.size * persp * S * 1.3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- 功能图标（iOS App 图标风格） ---------- */
const FEATURES = [
  { icon: 'search', title: '实时检索', sub: '联网搜索最新资讯、数据与本地信息', c: ['#0a84ff', '#5ac8fa'] },
  { icon: 'doc',    title: '一键成文', sub: '报告、邮件、方案，可导出 PDF 与 Word', c: ['#5e5ce6', '#bf5af2'] },
  { icon: 'file',   title: '读懂文件', sub: '基于你上传的资料，给出有据可依的回答', c: ['#30d158', '#64d2ff'] },
  { icon: 'image',  title: '创意生图', sub: '一句描述，生成原创视觉内容', c: ['#ff375f', '#ff9f0a'] },
];

function drawIcon(type, x, y, s, colors, alpha, scale){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.scale(scale, scale);
  const g = ctx.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
  g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
  ctx.shadowColor = colors[0]; ctx.shadowBlur = 50 * S;
  roundRect(-s / 2, -s / 2, s, s, s * .23);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  ctx.lineWidth = s * .065; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (type === 'search'){
    ctx.arc(-s * .05, -s * .05, s * .19, 0, Math.PI * 2);
    ctx.moveTo(s * .09, s * .09); ctx.lineTo(s * .23, s * .23);
    ctx.stroke();
  } else if (type === 'doc'){
    roundRect(-s * .19, -s * .26, s * .38, s * .52, s * .06); ctx.stroke();
    ctx.beginPath();
    [-.12, 0, .12].forEach((yy, i) => {
      ctx.moveTo(-s * .09, s * yy); ctx.lineTo(s * (i === 2 ? .02 : .09), s * yy);
    });
    ctx.lineWidth = s * .05; ctx.stroke();
  } else if (type === 'file'){
    ctx.moveTo(-s * .26, -s * .17); ctx.lineTo(-s * .08, -s * .17);
    ctx.lineTo(-s * .02, -s * .1); ctx.lineTo(s * .26, -s * .1);
    ctx.lineTo(s * .26, s * .2); ctx.lineTo(-s * .26, s * .2); ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s * .09, s * .05); ctx.lineTo(-s * .02, s * .11); ctx.lineTo(s * .11, -s * .01);
    ctx.lineWidth = s * .055; ctx.stroke();
  } else if (type === 'image'){
    roundRect(-s * .26, -s * .2, s * .52, s * .4, s * .06); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * .11, -s * .07, s * .05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * .2, s * .14); ctx.lineTo(-s * .06, -s * .01);
    ctx.lineTo(s * .05, s * .09); ctx.lineTo(s * .12, s * .03); ctx.lineTo(s * .2, s * .12);
    ctx.lineWidth = s * .05; ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 主时间线 ---------- */
const BRAND = ['#5ac8fa', '#5e5ce6', '#bf5af2', '#ff375f'];

function render(t){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawParticles(t);
  const cx = W / 2, cy = H / 2;

  // 场景 1（0–4s）：你好。
  let a = env(t, 1.6, 4.2);
  text('你好。', cx, cy, 120, { weight: 700, alpha: a, rise: riseOf(t, 1.6) });

  // 场景 2（4–8s）：我是你的 AI 商务助手
  text('我是你的', cx, cy - 75 * S, 40, { weight: 500, color: '#a1a1a6', alpha: env(t, 4.3, 8.2), rise: riseOf(t, 4.3) });
  text('AI 商务助手', cx, cy + 30 * S, 124, { weight: 700, grad: BRAND, alpha: env(t, 4.8, 8.2), rise: riseOf(t, 4.8) });

  // 场景 3（8–12s）：Logicc AI
  const sweep = t * 60;
  text('Logicc AI', cx, cy - 15 * S, 156, {
    weight: 700, alpha: env(t, 8.5, 12.2, 1),
    scale: lerp(1.15, 1, easeOut(seg(t, 8.5, 10.5))),
    grad: [0, 1, 2, 3].map(i => `hsl(${(200 + i * 40 + sweep) % 360 * .35 + 190},95%,65%)`)
  });
  text('Personal Business Assistant', cx, cy + 95 * S, 30, { weight: 500, color: '#a1a1a6', alpha: env(t, 9.3, 12.2), rise: riseOf(t, 9.3) });

  // 场景 4（12–20s）：核心能力
  text('我能为你做什么', cx, cy - 215 * S, 24, { weight: 500, color: '#86868b', alpha: env(t, 12.4, 20.4) });
  FEATURES.forEach((f, i) => {
    const s = 12.4 + i * 2, e = s + 2;
    const al = env(t, s, e, .45, .4);
    if (al <= 0) return;
    const pop = .6 + .4 * easeBack(seg(t, s, s + .6));
    drawIcon(f.icon, cx, cy - 70 * S, 120 * S, f.c, al, pop);
    text(f.title, cx, cy + 75 * S, 66, { weight: 700, alpha: al, rise: riseOf(t, s + .1) });
    text(f.sub, cx, cy + 132 * S, 26, { weight: 400, color: '#a1a1a6', alpha: al, rise: riseOf(t, s + .2) });
  });
  // 分页圆点
  const da = env(t, 12.4, 20.4);
  if (da > 0){
    const idx = clamp(Math.floor((t - 12.4) / 2), 0, 3);
    for (let i = 0; i < 4; i++){
      ctx.globalAlpha = da * (i === idx ? 1 : .3);
      ctx.fillStyle = '#f5f5f7';
      ctx.beginPath(); ctx.arc(cx + (i - 1.5) * 18 * S, cy + 190 * S, 4 * S, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 场景 5（20–25s）：准确。高效。实用。
  const words = [['准确。', ['#5ac8fa', '#0a84ff']], ['高效。', ['#5e5ce6', '#bf5af2']], ['实用。', ['#ff375f', '#ff9f0a']]];
  words.forEach(([w, gc], i) => {
    const s = 20.8 + i * .7;
    text(w, cx + (i - 1) * 270 * S, cy - 20 * S, 96, { weight: 700, grad: gc, alpha: env(t, s, 25, .6, .5), rise: riseOf(t, s) });
  });
  text('专为你的日常工作而生', cx, cy + 90 * S, 28, { weight: 500, color: '#a1a1a6', alpha: env(t, 23, 25, .6, .5), rise: riseOf(t, 23) });

  // 场景 6（25–30s）：结尾
  const endA = easeOut(seg(t, 25.6, 26.6));
  text('Logicc AI · 为 ChuxinNeko 准备', cx, cy - 85 * S, 26, { weight: 500, color: '#a1a1a6', alpha: endA, rise: riseOf(t, 25.6) });
  const endB = easeOut(seg(t, 26.2, 27.2));
  text('现在，开始对话。', cx, cy, 84, { weight: 700, alpha: endB, rise: riseOf(t, 26.2) });

  // 胶囊按钮
  const bA = easeOut(seg(t, 27.6, 28.4));
  if (bA > 0){
    const bw = 200 * S, bh = 56 * S, by = cy + 100 * S;
    ctx.save();
    ctx.globalAlpha = bA;
    ctx.translate(cx, by + riseOf(t, 27.6) * .6);
    const bg = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
    bg.addColorStop(0, '#0a84ff'); bg.addColorStop(1, '#bf5af2');
    ctx.shadowColor = '#5e5ce6'; ctx.shadowBlur = (25 + 15 * Math.sin(t * 3)) * S;
    roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
    ctx.fillStyle = bg; ctx.fill();
    ctx.restore();
    text('开始对话', cx, by + riseOf(t, 27.6) * .6, 24, { weight: 600, alpha: bA });
  }

  // 底部进度条与重播提示
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(0, H - 3, W, 3);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, H - 3, W * (t / DURATION), 3);
  if (t >= DURATION){
    text('点击画面重播', cx, H - 40 * S, 16, { weight: 400, color: '#6e6e73', alpha: .6 + .4 * Math.sin(performance.now() / 400) });
  }
}

/* ---------- 播放控制 ---------- */
let start = performance.now();
function loop(now){
  const t = Math.min((now - start) / 1000, DURATION);
  render(t);
  requestAnimationFrame(loop);
}
const restart = () => { start = performance.now(); };
cv.addEventListener('click', restart);
addEventListener('keydown', e => { if (e.code === 'Space') restart(); });
requestAnimationFrame(loop);
</script>
</body>
</html>
